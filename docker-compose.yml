services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - stats-api
    networks:
      - default
      - bot-stats-net

  stats-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STATS_DB_USER}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD}
      POSTGRES_DB: ${STATS_DB_NAME}
    volumes:
      - stats_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STATS_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-api:
    build: ./admin
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      stats-db:
        condition: service_healthy
    networks:
      - default
      - bot-stats-net

volumes:
  caddy_data:
  caddy_config:
  stats_db_data:

networks:
  bot-stats-net:
    external: true
