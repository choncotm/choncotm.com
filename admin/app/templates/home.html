<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — choncotm.com</title>
<style>
  body {
    background: #0a0a0a;
    color: #ece7db;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 2.5rem 1.5rem 4rem;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: 0 auto 2rem;
  }
  h1 {
    font-weight: 500;
    font-size: 1.4rem;
    margin: 0;
  }
  .links {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .links a {
    color: #a39d8f;
    font-size: 0.8rem;
    text-decoration: none;
    border: 1px solid rgba(201, 162, 39, 0.25);
    border-radius: 2px;
    padding: 0.35rem 0.7rem;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .links a:hover {
    color: #c9a227;
    border-color: #c9a227;
  }
  .dashboards {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .dashboards a {
    display: block;
    background: #111110;
    border: 1px solid rgba(201, 162, 39, 0.35);
    padding: 1rem 1.3rem;
    border-radius: 4px;
    color: #ece7db;
    text-decoration: none;
    font-size: 0.95rem;
  }
  .dashboards a:hover {
    border-color: #c9a227;
  }
  .empty {
    color: #6a655c;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="top">
    <h1>Bonjour, {{ user.username }}</h1>
    <div class="links">
      <a href="/">Voir le site</a>
      <a href="/admin/logout">Déconnexion</a>
    </div>
  </div>

  <div class="dashboards">
    {% for d in dashboards %}
    <a href="{{ d.url }}">{{ d.label }}</a>
    {% else %}
    <p class="empty">Aucun dashboard ne t'a encore été attribué.</p>
    {% endfor %}
  </div>
</body>
</html>
